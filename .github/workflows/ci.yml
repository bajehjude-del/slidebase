name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '!assets/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build Next.js app
      run: npm run build
      env:
        # Provide dummy env vars needed for a successful build if any
        NEXT_PUBLIC_API_URL: http://localhost:3001